<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
font-family:'Inter',sans-serif;
min-height:100vh;

display:flex;
justify-content:center;
align-items:center;

padding:20px;
overflow:hidden;
position:relative;
color:white;

background:
linear-gradient(rgba(0,0,0,0.82), rgba(0,0,0,0.88)),
url("background.png");

background-size:cover;
background-position:center;
background-attachment:fixed;
}

body::before{
content:"";
position:fixed;
inset:0;

background:
radial-gradient(circle at top right, rgba(168,85,247,0.28), transparent 30%),
radial-gradient(circle at bottom left, rgba(147,51,234,0.22), transparent 35%);

filter:blur(90px);
pointer-events:none;
}

.container{
width:100%;
max-width:500px;

padding:32px;
border-radius:30px;

background:rgba(10,5,20,0.62);
backdrop-filter:blur(18px);

border:1px solid rgba(168,85,247,0.18);

box-shadow:
0 0 40px rgba(168,85,247,0.18),
0 0 100px rgba(168,85,247,0.08);
}

.logo{
text-align:center;
margin-bottom:24px;
}

.logo img{
width:130px;
border-radius:22px;

box-shadow:
0 0 30px rgba(168,85,247,0.45);

transition:0.3s;
}

.logo img:hover{
transform:scale(1.05);
}

h1{
text-align:center;
font-size:2rem;
font-weight:800;
margin-bottom:28px;

background:linear-gradient(
90deg,
#f0abfc,
#c084fc,
#9333ea
);

-webkit-background-clip:text;
-webkit-text-fill-color:transparent;
}

.info-box{
padding:16px 18px;
margin-bottom:20px;

border-radius:18px;

background:rgba(255,255,255,0.04);

border:1px solid rgba(168,85,247,0.16);

color:#f5d0fe;
font-weight:600;
font-size:1rem;

box-shadow:
0 0 20px rgba(168,85,247,0.08);
}

.link{
display:flex;
justify-content:space-between;
align-items:center;

padding:18px 20px;
margin-bottom:14px;

border-radius:18px;

text-decoration:none;
color:#f3e8ff;

font-weight:600;

background:rgba(255,255,255,0.04);

border:1px solid rgba(168,85,247,0.12);

transition:0.25s;
position:relative;
overflow:hidden;
}

.link::before{
content:"";
position:absolute;
inset:0;

background:linear-gradient(
90deg,
rgba(168,85,247,0.18),
transparent
);

opacity:0;
transition:0.25s;
}

.link:hover{
transform:translateY(-2px) scale(1.01);

border-color:rgba(168,85,247,0.4);

box-shadow:
0 0 25px rgba(168,85,247,0.18);
}

.link:hover::before{
opacity:1;
}

.icon{
margin-right:8px;
}

.arrow{
opacity:0.6;
}

footer{
text-align:center;
margin-top:24px;

font-size:0.8rem;
color:#d8b4fe;
opacity:0.75;
}

</style>
